# @package _global_
defaults:
  - model: small
  - optimizer: adamw  
  - data: tinystories
  - experiment: full_train.yaml
  - _self_


# Learning rate schedule
lr_schedule:
  _target_: cs336_basics.lr_scheduler.CosineScheduler
  alpha_max: ${optimizer.lr}
  alpha_min: 3e-5
  Tw: 10000
  Tc: 35000
  
# Training parameters
max_iterations: 40000
batch_size: 32
context_length: ${model.context_length}
device: cuda
seed: 42
gradient_clip_norm: 1.0

# Mixed precision training
use_bf16: true  # Enable BF16 for Tensor Core acceleration

# Logging
log_freq: 100
val_freq: 500
save_freq: 1000
wandb_project: "cs336-language-model"
val_batches: 10

# Paths
data_dir: "./data"
resume_from: null