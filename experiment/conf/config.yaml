# @package _global_
defaults:
  - _self_
  - model: small
  - optimizer: adamw  
  - data: tinystories
  - experiment: full_train

# Learning rate schedule using relative parameters
lr_schedule:
  _target_: cs336_basics.lr_scheduler.CosineScheduler
  alpha_max: ${optimizer.lr}
  alpha_min: ${eval:"${optimizer.lr} * 0.1"}
  Tw: ${eval:"int(${max_iterations} * 0.1)"}
  Tc: ${eval:"int(${max_iterations} * 0.9)"}

# Training parameters
total_tokens: 327680000
batch_size: 128
context_length: ${model.context_length}
max_iterations: ${eval:"int(${total_tokens} / ${batch_size} / ${context_length})"}
device: cuda
seed: 42
gradient_clip_norm: 1.0

# Mixed precision training
use_bf16: false  # Enable BF16 for Tensor Core acceleration

# Logging
log_freq: 100
val_freq: 500
save_freq: 1000
wandb_project: "cs336-language-model"
wandb_name: "base-model-${optimizer.lr}-${batch_size}"
val_batches: 10

# Paths
data_dir: "./data"
resume_from: null