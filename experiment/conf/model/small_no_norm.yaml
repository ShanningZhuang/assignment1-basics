# @package model
# Model configuration for layer normalization ablation study
# This removes all RMSNorm layers to test their importance for training stability
_target_: cs336_basics.Transformer.TransformerLM
vocab_size: 10000
d_model: 512
num_heads: 16
d_ff: 1344
num_layers: 4
context_length: 256
rope_theta: 10000.0
norm_type: "nonorm"  # Remove all normalization layers
use_rope: true
ffn_type: "swiglu"
